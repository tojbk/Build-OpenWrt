name: H3C NX30PRO

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/1715173329/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 系统初始化
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          echo "=== 1. 清理冗余镜像、工具目录与 Swap ==="
          docker image prune -af 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY:-}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf ~/{.cargo,.dotnet,.rustup} /root/{.cargo,.dotnet,.rustup} 2>/dev/null || true
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/.bashrc /root/.profile 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile

          echo "=== 2. 卸载无关大软件包并安装 OpenWrt 编译依赖 ==="
          sudo apt-get -o Acquire::Retries=3 -y update
          sudo apt-get -y purge \
            azure-cli 'ghc*' 'zulu*' 'llvm*' firefox 'google*' \
            'dotnet*' powershell 'openjdk*' 'mongodb*' || true
          sudo apt-get -o Acquire::Retries=3 -y install \
            $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo systemctl daemon-reload 2>/dev/null || true

          echo "=== 3. 配置时区与时间同步 ==="
          sudo ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime && echo "${TZ}" | sudo tee /etc/timezone >/dev/null || true
          sudo timedatectl set-timezone "${TZ}" 2>/dev/null || true
          sudo ntpdate -u ntp.ubuntu.com 0.pool.ntp.org 2>/dev/null || true
          sudo timedatectl set-ntp true 2>/dev/null || true
          date -u

          echo "=== 4. 创建 XFS 工作目录挂载 ==="
          root_avail=$(df -BG --output=avail / | tail -1 | tr -d 'G ')
          reserve_gb=6
          root_size=$(( root_avail - reserve_gb ))
          if [[ "${root_size}" -le 10 ]]; then
            echo "Error: 可用空间不足，当前可用: ${root_avail}G，分配给 /workdir: ${root_size}G"
            exit 1
          fi
          
          echo "根分区可用: ${root_avail}G，为 /workdir 创建 ${root_size}G XFS 镜像..."
          sudo truncate -s "${root_size}G" /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /workdir
          sudo mount -o noatime "${build_dev}" /workdir
          sudo chown -R "$(id -un):$(id -gn)" /workdir
          df -Th
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: 下载源码
        run: |
          set -euo pipefail
          df -hT /workdir
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" /workdir/openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: 加载缓存
        uses: actions/cache@v5
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 加载设置 diy-part1
        run: |
          set -euo pipefail
          [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: 更新安装feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置 diy-part2
        run: |
          set -euo pipefail
          [ -d files ] && mv files openwrt/files
          [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 下载dl包
        id: package
        run: |
          set -euo pipefail
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          set -euo pipefail
          cd openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: 上传bin目录
        uses: actions/upload-artifact@v6
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          set -euo pipefail
          target_dir=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)
          [ -n "$target_dir" ] && cd "$target_dir"
          find . \( -name "*buildinfo*" -o -name "*sha256sums*" -o -name "*manifest*" -o -name "*json*" -o -name "*kernel.bin*" -o -name "*factory.bin*" \) -exec rm -rf {} +
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"
          df -Th

      - name: 上传固件artifact
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 生成release标签
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 发布固件到Release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: H3C NX30PRO OpenWrt ${{ steps.tag.outputs.release_tag }}
          body: |
            📦 固件编译时间：${{ steps.tag.outputs.release_tag }}
            📶 设备：H3C NX30PRO (MT7981)
            🧱 源码：immortalwrt-mt798x（hanwckf） openwrt-21.02
            ⚙️ 内核版本：Linux 5.4.284
            🖥️ 编译环境：Ubuntu 22.04
            🔗 默认访问地址：http://192.168.123.1
            👤 用户名：root
            🔑 登录密码：password
            🔑 WiFi密码：sina2008
            📝 更新说明
            - OpenClash v0.48.002
          files: ${{ env.FIRMWARE }}/*

      - name: 删除旧Workflow记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 2

      - name: 删除旧Release（保留最新2个）
        if: steps.release.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t RELEASES < <(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[2:] | .[].tagName')
          for tag in "${RELEASES[@]}"; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" -y --cleanup-tag
          done
