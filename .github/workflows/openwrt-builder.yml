name: H3C NX30PRO

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/1715173329/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: 系统初始化
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Asia/Shanghai
      run: |
        set -euo pipefail
      
        # 清理docker镜像
        docker rmi -f $(docker images -q) 2>/dev/null || true
        sudo docker image prune -a -f
        # 清理runner预装大体积工具
        [[ -n "${AGENT_TOOLSDIRECTORY:-}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
        # 关闭swap
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        # 停止docker、调整snap
        sudo systemctl stop docker || true
        sudo snap set system refresh.retain=2
        # 清理root环境配置
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        # 批量卸载不需要的预装包
        sudo -E apt -y purge \
        azure-cli ghc* zulu* texlive* firefox google* dotnet* \
        powershell openjdk* mongodb* moby* || true
        # 更新源、安装OpenWrt编译依赖
        sudo -E apt update
        sudo -E apt -y install $(curl -fsSL https://ophub.org/ubuntu2204-make-openwrt-depends)
        sudo -E apt-get -qq install libfuse-dev
        # apt垃圾回收
        sudo -E apt -y autoremove --purge
        sudo -E apt clean && sudo -E apt autoclean
        sudo systemctl daemon-reload || true
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        # 自动获取空闲loop设备
        LOOP1=$(sudo losetup -f)
        LOOP2=$(sudo losetup -f)
        # 计算可用空间（保留原有逻辑，预留安全空间）
        mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
        root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
        # 生成稀疏镜像文件
        sudo truncate -s "${mnt_size}"G /mnt/mnt.img
        sudo truncate -s "${root_size}"G /root.img
        # 绑定loop
        sudo losetup "${LOOP1}" /mnt/mnt.img
        sudo losetup "${LOOP2}" /root.img
        # LVM创建
        sudo pvcreate "${LOOP1}"
        sudo pvcreate "${LOOP2}"
        sudo vgcreate github "${LOOP1}" "${LOOP2}"
        sudo lvcreate -n runner -l 100%FREE github
        # 格式化XFS
        sudo mkfs.xfs /dev/github/runner
        # 创建工作目录并挂载（重点补上）
        sudo mkdir -p /workdir
        sudo mount /dev/github/runner /workdir
        sudo chown "$USER:$(id -g -n "$USER")" /workdir
        df -hT
        free -h

    - name: 下载源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载缓存
      uses: actions/cache@v5
      with:
        path: |
          /workdir/openwrt/dl
          /workdir/openwrt/build_dir
          /workdir/openwrt/staging_dir
          /workdir/openwrt/ccache
        key: ${{ runner.os }}-openwrt-${{ hashFiles('**/feeds.conf.default','**/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-

    - name: 加载设置 diy-part1
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载配置 diy-part2
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载dl包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 上传bin目录
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        # 如需factory.bin，删掉下面这一行里 factory.bin
        find . \( -name "*buildinfo*" -o -name "*sha256sums*" -o -name "*manifest*" -o -name "*json*" -o -name "*kernel.bin*" \) -exec rm -rf {} +
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件artifact
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成release标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布固件到Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: H3C NX30PRO OpenWrt ${{ steps.tag.outputs.release_tag }}
        body: |
          📦 固件编译时间：${{ steps.tag.outputs.release_tag }}
          📶 设备：H3C NX30PRO (MT7981)
          🧱 源码：immortalwrt-mt798x openwrt-21.02
          🖥️ 编译环境：Ubuntu 24.04
          🔗 默认访问地址：http://192.168.123.1
          👤 默认用户名：root
          🔑 默认密码：password
        files: ${{ env.FIRMWARE }}/*

    - name: 删除旧Workflow记录
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 2

    - name: 删除旧Release（保留最新2个）
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 获取所有release，按发布时间排序，跳过最新2个，其余删除
        RELEASES=$(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[2:] | .[].tagName')
        for tag in $RELEASES; do
          gh release delete "$tag" -y
          git push origin --delete "$tag"
        done

