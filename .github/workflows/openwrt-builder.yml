name: H3C NX30PRO

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/1715173329/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  BUILD_DIR: $HOME/build/openwrt
  CCACHE_DIR: $HOME/build/openwrt/ccache
  USE_CCACHE: 1
  TAG_PREFIX: "NX30PRO-"
  CONF_WORKSPACE: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 配置仓库
        uses: actions/checkout@v5

      - name: 系统初始化 + 释放磁盘空间
        run: |
          set -eo pipefail
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          docker images -q | xargs -r docker rmi -f 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android ~/.cargo ~/.dotnet ~/.rustup /opt/ghc 2>/dev/null || true
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install apt-transport-https ca-certificates
          sudo apt-get -y autoremove --purge || true
          sudo apt-get clean
          df -hT
          free -h

      - name: 安装依赖
        run: |
          set -eo pipefail
          DEPS=$(curl -fsSL --connect-timeout 15 https://ophub.org/ubuntu2204-make-openwrt-depends)
          if [[ -n "${DEPS}" ]]; then
            sudo apt-get -y install ${DEPS}
          fi

      - name: 拉取源码
        run: |
          set -eo pipefail
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          git config --global http.postBuffer 524288000
          git config --global http.timeout 300
          git clone --depth=1 --single-branch -b $REPO_BRANCH $REPO_URL .
          echo "✅ OpenWrt源码拉取完成，源码目录：$BUILD_DIR"

      - name: 加载编译缓存
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUILD_DIR }}/dl
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-nx30pro-${{ hashFiles('${{ env.CONF_WORKSPACE }}/feeds.conf.default','${{ env.CONF_WORKSPACE }}/.config') }}
          restore-keys: |
            ${{ runner.os }}-nx30pro-

      - name: 执行 diy-part1.sh
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          [ -e $CONF_WORKSPACE/$FEEDS_CONF ] && cp $CONF_WORKSPACE/$FEEDS_CONF feeds.conf.default
          chmod +x $CONF_WORKSPACE/$DIY_P1_SH
          $CONF_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          ./scripts/feeds update -a || (sleep 10 && ./scripts/feeds update -a)

      - name: 安装 feeds
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          ./scripts/feeds install -a

      - name: 执行 diy-part2.sh
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          [ -d $CONF_WORKSPACE/files ] && cp -r $CONF_WORKSPACE/files ./
          [ -e $CONF_WORKSPACE/$CONFIG_FILE ] && cp $CONF_WORKSPACE/$CONFIG_FILE .config
          echo "CONFIG_CCACHE=y" >> .config
          chmod +x $CONF_WORKSPACE/$DIY_P2_SH
          $CONF_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: 预下载dl包
        id: package
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          set -eo pipefail
          cd $BUILD_DIR
          echo "开始编译，CPU核心：$(nproc)"
          make -j4 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 上传bin目录
        uses: actions/upload-artifact@v6
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.BUILD_DIR }}/bin

      - name: 筛选固件，清理无用文件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          set -eo pipefail
          cd $BUILD_DIR/bin/targets/*/*
          find . \( -name "*buildinfo*" -o -name "*sha256sums*" -o -name "*manifest*" -o -name "*json*" -o -name "*kernel.bin*" \) -exec rm -rf {} +
          rm -rf packages
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 固件上传Artifact
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_DIR }}

      - name: 生成Release标签
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        run: |
          set -eo pipefail
          TAG_NAME="${{ env.TAG_PREFIX }}$(date +"%Y.%m.%d-%H%M")"
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布Release
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.release_tag }}
          FIRMWARE_DIR: ${{ env.FIRMWARE_DIR }}
        run: |
          set -eo pipefail
          cd "${FIRMWARE_DIR}"
          # 先收集固件文件列表，gh release create 不能直接带*
          FIRM_FILES=()
          for f in *; do
            [ -f "$f" ] && FIRM_FILES+=("$f")
          done
          if [ ${#FIRM_FILES[@]} -eq 0 ]; then
            echo "❌ 没有找到固件文件，跳过release发布"
            exit 1
          fi
          gh release create "${TAG_NAME}" \
            --title "H3C NX30PRO OpenWrt ${TAG_NAME}" \
            --notes "📶 设备：H3C NX30PRO (MT7981)
          🧱 源码：immortalwrt‑mt798x openwrt‑21.02
          ⚙️ 开启CCACHE加速编译
          🔗 默认后台：http://192.168.1.1
          👤 用户：root
          🔑 密码：password" \
            "${FIRM_FILES[@]}"

      - name: 清理旧Workflow运行记录
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          WF_NAME="${{ github.workflow }}"
          RUNS=$(gh run list --workflow "${WF_NAME}" --limit 100 --json databaseId,createdAt,status)
          echo "$RUNS" | jq -r '
            .[2:] |
            map(select(
              (.createdAt | fromdateiso8601) < (now - 86400)
            )) |
            .[].databaseId
          ' | while read -r rid; do
              if [ -n "$rid" ]; then
                echo "删除运行记录: $rid"
                gh run delete "$rid"
              fi
            done

      - name: 删除旧Release（保留最新3个）
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          RELEASES=$(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[3:] | .[].tagName')
          if [[ -z "$RELEASES" ]]; then
            echo "✅ Release数量不足3个，无需删除"
            exit 0
          fi
          echo "$RELEASES" | while read -r tag; do
            echo "删除旧release: $tag"
            gh release delete "$tag" -y
            git push origin --delete "$tag" || echo "tag远程已经不存在，跳过"
          done
